[project]
name = "zeroday-verify"
version = "0.1.0"
description = "Empirical verification of the threat / zero-day detection method (PhD contribution formalism)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E702"]  # E702: allow compact `ax.set(...); fig.savefig(...)` in plot code
